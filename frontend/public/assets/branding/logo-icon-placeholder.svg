<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="32" fill="#2563EB" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Isometric Hexagonal Shield -->
  <path d="M50 12 L82 30 L82 70 L50 88 L18 70 L18 30 Z" 
        stroke="url(#gradPrimary)" stroke-width="3" fill="url(#gradHighlight)" stroke-linejoin="round" />

  <!-- Geometric 3D Cube Facets -->
  <!-- Top Facet -->
  <polygon points="50,22 74,36 50,50 26,36" fill="#3B82F6" opacity="0.9" stroke="#60A5FA" stroke-width="1.5" />
  <!-- Left Facet -->
  <polygon points="26,36 50,50 50,78 26,64" fill="#1D4ED8" opacity="0.85" stroke="#3B82F6" stroke-width="1.5" />
  <!-- Right Facet -->
  <polygon points="50,50 74,36 74,64 50,78" fill="#0A192F" opacity="0.9" stroke="#06B6D4" stroke-width="1.5" />

  <!-- Central Luminous Core -->
  <circle cx="50" cy="50" r="4" fill="#06B6D4" filter="url(#glow)" />
</svg>
